name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build the release binary
        run: cargo build --release --locked

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: continuous-release/harness
          path: harness

      - name: Build the harness
        working-directory: harness
        run: cargo build --release --locked

      - name: Run the local release scenarios against this binary
        working-directory: harness
        env:
          CR_BIN: ${{ github.workspace }}/target/release/cr
        run: cargo run --release --locked -- run --all
