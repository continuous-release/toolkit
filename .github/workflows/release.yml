name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    uses: continuous-release/.github/.github/workflows/auto-release.yml@main
    with:
      system: node
      toolkit-ref: v0.1.0
      setup-command: corepack enable && pnpm install --frozen-lockfile
      test-command: pnpm test && pnpm typecheck
      build-command: |
        set -euo pipefail
        pnpm build
        git diff --exit-code packages/cli/dist/cli.js
        mkdir -p dist
        tar -czf "dist/continuous-release-toolkit-$VERSION.tgz" \
          packages/cli/dist/cli.js action.yml README.md LICENSE
      artifact-glob: dist/*.tgz
